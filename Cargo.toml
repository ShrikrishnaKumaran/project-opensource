[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/scraper",
    "crates/captcha",
    "crates/storage",
    "crates/sync",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
domain = { path = "crates/domain" }
scraper = { path = "crates/scraper" }
captcha = { path = "crates/captcha" }
storage = { path = "crates/storage" }
sync = { path = "crates/sync" }
dioxus = { version = "=0.7.10", features = ["mobile"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls-webpki-roots"] }
regex = { version = "=1.13.2" }
base64 = { version = "=0.22.1" }
serde_json = { version = "=1.0.154" }
# HTML scraper — aliased to avoid name collision with our `scraper` workspace member
html_scraper = { package = "scraper", version = "0.22" }
